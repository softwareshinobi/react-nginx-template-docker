##
## This configuration handles client-side routing for single-page applications.
##

server {

    listen 80;

    server_name localhost;

    ## Set the root directory for serving files. This is where your React build files will be.

    root /usr/share/nginx/html;

    ## Specify the default file to serve.

    index index.html index.htm;

    ## This is the key part for client-side routing.

    location / {

        # First, try to serve the requested file or directory as-is.
        # If it doesn't exist, fall back to serving index.html.

        try_files $uri $uri/ /index.html;

    }

    ## Optional: Configure gzip compression to improve performance.

    gzip on;

    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

}
